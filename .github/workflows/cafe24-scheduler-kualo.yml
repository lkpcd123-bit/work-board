# 쿠알로 카페24 몰용 스케줄러 — cafe24-scheduler.yml 과 동일 로직, 시크릿(C24K_*)과 Firestore 필드(*_kualo)만 다름.
# 로직을 고치면 두 파일을 함께 고칠 것.
name: 카페24 상품 스케줄러 (쿠알로)

on:
  schedule:
    - cron: '*/5 * * * *'  # 5분마다 실행 (매분 설정은 GitHub이 임의로 걸러서 몇 시간씩 밀림)
  workflow_dispatch:      # 수동 실행 버튼

# refresh token은 일회용이라 실행이 겹치면 서로의 토큰을 무효화함 → 한 번에 하나만 실행
concurrency:
  group: cafe24-scheduler-kualo
  cancel-in-progress: false

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 카페24 상품 스케줄 실행
        uses: actions/github-script@v7
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          C24_CLIENT_ID: ${{ secrets.C24K_CLIENT_ID }}
          C24_CLIENT_SECRET: ${{ secrets.C24K_CLIENT_SECRET }}
          C24_MALL_ID: ${{ secrets.C24K_MALL_ID }}
          C24_REDIRECT_URI: ${{ secrets.C24K_REDIRECT_URI }}
        with:
          script: |
            const FIREBASE_URL = `https://firestore.googleapis.com/v1/projects/${process.env.FIREBASE_PROJECT_ID}/databases/(default)/documents/board/main`;
            const MALL_ID = process.env.C24_MALL_ID;
            const CLIENT_ID = process.env.C24_CLIENT_ID;
            const CLIENT_SECRET = process.env.C24_CLIENT_SECRET;

            // ── Firestore REST API 헬퍼 ──────────────────────────────
            async function firestoreGet() {
              const res = await fetch(`${FIREBASE_URL}?key=${process.env.FIREBASE_API_KEY}`);
              if (!res.ok) throw new Error(`Firestore GET 실패: ${res.status}`);
              return res.json();
            }

            async function firestoreUpdate(fields) {
              const mask = Object.keys(fields).map(f => `updateMask.fieldPaths=${f}`).join('&');
              const res = await fetch(`${FIREBASE_URL}?key=${process.env.FIREBASE_API_KEY}&${mask}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fields }),
              });
              if (!res.ok) throw new Error(`Firestore PATCH 실패: ${res.status}`);
              return res.json();
            }

            // Firestore 값 파싱
            function parseValue(v) {
              if (!v) return null;
              if (v.stringValue !== undefined) return v.stringValue;
              if (v.integerValue !== undefined) return parseInt(v.integerValue);
              if (v.booleanValue !== undefined) return v.booleanValue;
              if (v.doubleValue !== undefined) return v.doubleValue;
              if (v.nullValue !== undefined) return null;
              if (v.arrayValue) return (v.arrayValue.values || []).map(parseValue);
              if (v.mapValue) {
                const obj = {};
                for (const [k, val] of Object.entries(v.mapValue.fields || {})) obj[k] = parseValue(val);
                return obj;
              }
              return null;
            }

            // JS 값 → Firestore 값
            function toFirestoreValue(v) {
              if (v === null || v === undefined) return { nullValue: null };
              if (typeof v === 'boolean') return { booleanValue: v };
              if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
              if (typeof v === 'string') return { stringValue: v };
              if (Array.isArray(v)) return { arrayValue: { values: v.map(toFirestoreValue) } };
              if (typeof v === 'object') {
                const fields = {};
                for (const [k, val] of Object.entries(v)) fields[k] = toFirestoreValue(val);
                return { mapValue: { fields } };
              }
              return { stringValue: String(v) };
            }

            // ── 토큰 갱신 ──────────────────────────────────────────
            async function refreshToken(refreshToken) {
              const creds = Buffer.from(`${CLIENT_ID}:${CLIENT_SECRET}`).toString('base64');
              const res = await fetch(`https://${MALL_ID}.cafe24api.com/api/v2/oauth/token`, {
                method: 'POST',
                headers: {
                  'Authorization': `Basic ${creds}`,
                  'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: refreshToken }),
              });
              const data = await res.json();
              if (!data.access_token) throw new Error('토큰 갱신 실패: ' + JSON.stringify(data));
              return data;
            }

            // ── 상품 수정 (판매상태/진열상태) ──────────────────────
            async function updateProduct(token, productNo, payload) {
              const url = `https://${MALL_ID}.cafe24api.com/api/v2/admin/products/${productNo}`;
              const res = await fetch(url, {
                method: 'PUT',
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'X-Cafe24-Api-Version': '2026-03-01',
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ shop_no: 1, request: payload }),
              });
              const data = await res.json();
              console.log(`상품 ${productNo} 수정 응답:`, JSON.stringify(data));
              return !!data.product;
            }

            // ── 품목(옵션) 목록 조회 ─────────────────────────────
            async function getVariants(token, productNo) {
              const url = `https://${MALL_ID}.cafe24api.com/api/v2/admin/products/${productNo}/variants?limit=100`;
              const res = await fetch(url, {
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'X-Cafe24-Api-Version': '2026-03-01',
                },
              });
              const data = await res.json();
              if (!data.variants) console.log(`품목 조회 응답 이상:`, JSON.stringify(data).slice(0, 300));
              return data.variants || [];
            }

            // ── 품목 재고 수정 (진짜 "품절" 처리는 여기서) ──────────
            async function setVariantSoldout(token, productNo, variantCode) {
              const url = `https://${MALL_ID}.cafe24api.com/api/v2/admin/products/${productNo}/variants/${variantCode}/inventories`;
              const res = await fetch(url, {
                method: 'PUT',
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'X-Cafe24-Api-Version': '2026-03-01',
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ shop_no: 1, request: { use_inventory: 'T', display_soldout: 'T', quantity: 0 } }),
              });
              const data = await res.json();
              console.log(`품목 ${variantCode} 재고(품절) 수정 응답:`, JSON.stringify(data));
              return !data.error;
            }

            // 상품의 모든 품목을 재고 0 + 품절표시로 만들고, 판매도 중지
            async function markProductSoldout(token, productNo) {
              const variants = await getVariants(token, productNo);
              if (!variants.length) {
                console.log(`⚠ 품목을 찾을 수 없음: #${productNo} — 판매중지만 처리`);
                return await updateProduct(token, productNo, { selling: 'F' });
              }
              let allOk = true;
              for (const v of variants) {
                const code = v.variant_code;
                const ok = await setVariantSoldout(token, productNo, code);
                if (!ok) allOk = false;
              }
              await updateProduct(token, productNo, { selling: 'F' });
              return allOk;
            }

            // ── 메인 로직 ──────────────────────────────────────────
            const now = new Date();
            // 스케줄 시각(openAt/closeAt)은 시간대 표시 없는 한국 시간 → 러너(UTC)에서 9시간 밀리지 않게 +09:00로 해석
            const kst = (t) => new Date(/(Z|[+-]\d{2}:?\d{2})$/i.test(t) ? t : t + '+09:00');
            console.log(`[${now.toISOString()}] 스케줄 체크 시작`);

            const doc = await firestoreGet();
            const fields = doc.fields || {};
            const schedules = parseValue(fields.cafe24_schedules_kualo) || [];
            const tokenData = parseValue(fields.cafe24_token_data_kualo) || {};

            if (!tokenData.refresh_token) {
              console.log('Refresh Token 없음 - 업무보드에서 먼저 로그인 필요');
              return;
            }

            // 토큰 만료 10분 전이면 갱신
            let accessToken = tokenData.access_token;
            let expiry = tokenData.expiry || 0;

            if (!accessToken || expiry - Date.now() < 600000) {
              console.log('토큰 갱신 중...');
              let base = tokenData, newToken = null;
              try {
                newToken = await refreshToken(base.refresh_token);
              } catch (e) {
                // 웹앱 등 다른 곳이 먼저 갱신했을 수 있음 → Firestore 최신 토큰으로 1회 재확인
                const latest = parseValue(((await firestoreGet()).fields || {}).cafe24_token_data_kualo) || {};
                if (latest.access_token && latest.expiry - Date.now() > 600000) {
                  accessToken = latest.access_token; expiry = latest.expiry;
                  console.log('다른 곳에서 이미 갱신된 토큰 사용');
                } else if (latest.refresh_token && latest.refresh_token !== base.refresh_token) {
                  base = latest;
                  newToken = await refreshToken(base.refresh_token);
                } else throw e;
              }
              if (newToken) {
                accessToken = newToken.access_token;
                expiry = Date.now() + (newToken.expires_in || 7200) * 1000;
                const newTokenData = {
                  ...base,
                  access_token: accessToken,
                  expiry,
                  refresh_token: newToken.refresh_token || base.refresh_token,
                };
                // 새 refresh token은 이 저장이 유일한 기록 → 실패하면 토큰 체인이 끊기므로 재시도
                for (let i = 0; ; i++) {
                  try { await firestoreUpdate({ cafe24_token_data_kualo: toFirestoreValue(newTokenData) }); break; }
                  catch (e) { if (i >= 3) throw e; await new Promise(r => setTimeout(r, 1000 * (i + 1))); }
                }
                console.log('토큰 갱신 완료');
              }
            }

            // 스케줄 실행
            let changed = false;
            const updated = await Promise.all(schedules.map(async (s) => {
              if (!s || typeof s !== 'object') return s;
              const item = { ...s };

              // 오픈 처리
              if (item.openAt && !item.openDone && kst(item.openAt) <= now) {
                console.log(`🟢 오픈 실행: #${item.productNo} ${item.productName}`);
                const payload = { selling: item.openSelling || 'T', display: item.openDisplay || 'T' };
                const ok = await updateProduct(accessToken, item.productNo, payload);
                if (ok) { item.openDone = true; changed = true; console.log(`✅ 오픈 완료`); }
                else { item.error = '오픈 실패'; changed = true; }
              }

              // 종료 처리
              if (item.closeAt && !item.closeDone && kst(item.closeAt) <= now) {
                console.log(`🔴 종료 실행: #${item.productNo} ${item.productName} (처리: ${item.closeAction || 'soldout'})`);
                let ok;
                if (item.closeAction === 'hide') {
                  ok = await updateProduct(accessToken, item.productNo, { selling: 'F', display: 'F' });
                } else if (item.closeAction === 'selling_off') {
                  ok = await updateProduct(accessToken, item.productNo, { selling: 'F' });
                } else {
                  // 'soldout' (기본값): 품목별 재고 0 + 품절표시 + 판매중지
                  ok = await markProductSoldout(accessToken, item.productNo);
                }
                if (ok) { item.closeDone = true; changed = true; console.log(`✅ 종료 완료`); }
                else { item.error = '종료 실패'; changed = true; }
              }

              return item;
            }));

            if (changed) {
              await firestoreUpdate({ cafe24_schedules_kualo: toFirestoreValue(updated) });
              console.log('스케줄 업데이트 완료');
            } else {
              console.log('실행할 스케줄 없음');
            }
